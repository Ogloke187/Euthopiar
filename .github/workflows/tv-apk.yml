name: TX12 TV APK (one-click)

# Add this file to your fork at: .github/workflows/tv-apk.yml
# Then: Actions tab -> "TX12 TV APK (one-click)" -> Run workflow -> download
# the euthopiar-tx12-apk artifact (ZIP containing the APK) -> sideload.
# Also runs automatically on every push to main / develop / tx12-tv.

on:
  workflow_dispatch:
  push:
    branches: [main, develop, tx12-tv]

jobs:
  build-tv-debug:
    name: Build TX12 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload TX12 APK
        uses: actions/upload-artifact@v4
        with:
          name: euthopiar-tx12-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
